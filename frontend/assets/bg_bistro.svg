<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bistroSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27120b"/>
      <stop offset="55%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="domeGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bistroSky)"/>
  <rect width="1200" height="400" fill="url(#domeGlow)"/>

  <!-- Charakterystyczna Kopuła w centrum ("Pod Kopułą") -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.32">
    <path d="M 320 400 C 320 140, 880 140, 880 400" stroke-width="4"/>
    <path d="M 390 400 C 390 170, 810 170, 810 400"/>
    <path d="M 470 400 C 470 190, 730 190, 730 400"/>
    <path d="M 550 400 C 550 205, 650 205, 650 400"/>
    <line x1="600" y1="160" x2="600" y2="400" stroke-width="2.5"/>
    <line x1="280" y1="330" x2="920" y2="330"/>
    <line x1="340" y1="265" x2="860" y2="265"/>
    <!-- Iglica kopuły -->
    <path d="M 580 205 Q 600 135 620 205" fill="#f59e0b" fill-opacity="0.25"/>
  </g>

  <!-- Wiszące lampy bistro (Edison bulbs) -->
  <g stroke="#fcd34d" stroke-width="1.5" opacity="0.75">
    <line x1="160" y1="0" x2="160" y2="110"/>
    <polygon points="140,110 180,110 190,125 130,125" fill="#78350f"/>
    <circle cx="160" cy="132" r="10" fill="#fef08a"/>

    <line x1="310" y1="0" x2="310" y2="85"/>
    <polygon points="290,85 330,85 340,100 280,100" fill="#78350f"/>
    <circle cx="310" cy="107" r="10" fill="#fef08a"/>

    <line x1="890" y1="0" x2="890" y2="85"/>
    <polygon points="870,85 910,85 920,100 860,100" fill="#78350f"/>
    <circle cx="890" cy="107" r="10" fill="#fef08a"/>

    <line x1="1040" y1="0" x2="1040" y2="110"/>
    <polygon points="1020,110 1060,110 1070,125 1010,125" fill="#78350f"/>
    <circle cx="1040" cy="132" r="10" fill="#fef08a"/>
  </g>

  <!-- Sylwetki kieliszków do wina i karafki po bokach -->
  <g fill="#fde68a" opacity="0.18">
    <path d="M 90 280 Q 90 320 115 320 Q 140 320 140 280 Z"/>
    <rect x="113" y="320" width="4" height="45"/>
    <rect x="98" y="365" width="34" height="5" rx="2"/>

    <path d="M 1055 280 Q 1055 320 1080 320 Q 1105 320 1105 280 Z"/>
    <rect x="1078" y="320" width="4" height="45"/>
    <rect x="1063" y="365" width="34" height="5" rx="2"/>
  </g>
</svg>
